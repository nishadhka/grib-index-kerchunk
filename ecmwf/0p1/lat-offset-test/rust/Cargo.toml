[package]
name = "aecsync"
version = "0.1.0"
edition = "2021"
description = "Find CCSDS RSI starts in a byte window of a GRIB2 template-5.42 message (latitude-band reads); Rust port of ../v5 for benchmarking"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
